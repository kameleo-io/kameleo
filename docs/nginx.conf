# Static site config for Retype-generated documentation
# Running behind Cloudflare; assume TLS termination and HTTP/2 handled upstream.

# Hide nginx exact version
server_tokens off;

map $sent_http_content_type $static_file_cache_control {
  default                   "public, max-age=300"; # 5 minutes default
  ~*text/css                 "public, max-age=31536000, immutable";
  ~*application/javascript   "public, max-age=31536000, immutable";
  ~*application/json         "public, max-age=300";   # JSON may change
  ~*image/                   "public, max-age=31536000, immutable";
  ~*font/                    "public, max-age=31536000, immutable";
  ~*svg                      "public, max-age=31536000, immutable";
}

map $uri $x_robots_tag {
  default                    "";
  /llms.txt                  "noindex";
  ~*\.md$                    "noindex";
  ~^/static/sdk-examples/    "noindex";
}

# Redirect rules
map $uri $redirect_uri {
  default                                      "";
  ~^/reference/api-rate-limits/?$              /reference/usage-limits/;
}

# Proxied redirects should use public HTTPS; direct/local redirects keep their original scheme.
map $http_x_forwarded_proto $redirect_scheme {
  default $scheme;
  http    https;
  https   https;
}

# Redirect Cloudflare HTTP visitors, but leave direct/local HTTP requests unchanged.
map $http_x_forwarded_proto $redirect_to_https {
  default 0;
  http    1;
}

# Retype outputs an index.html root and other static assets.
server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;

  if ($redirect_uri) {
    return 301 $redirect_scheme://$http_host$redirect_uri$is_args$args;
  }

  if ($redirect_to_https) {
    return 301 https://$host$request_uri;
  }

  # Serve sdk-examples code files as plain text for viewing in browser
  location /static/sdk-examples/ {
    default_type text/plain;
  }

  # Any unmatched path raises 404 here; error_page below fills in the body while keeping the 404 status
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # Cache control logic: set per content type after response content type known.
  # Use a post-processing handler (header filter). We'll assign in a dedicated location block but easier via types mapping + add_header.
  # We can't conditionally add header after content-type mapping easily, so use add_header with always and map variable.
  add_header Cache-Control $static_file_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Robots-Tag $x_robots_tag always;

  # If .gz files exist, serve directly.
  gzip_static on;

  # Deny access to hidden files or config (defense-in-depth)
  location ~ /\.(?!well-known).* { return 404; }

  # Retype publishes raw Markdown for AI agents
  location ~* \.md$ {
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
  }
}
